<div id="organization-content">
</div>

<!-- Add Objective dialog -->
<div id="add-objective-backdrop"
    class="dialog-backdrop hidden"></div>
<div id="add-objective-dialog"
    class="dialog hidden" aria-hidden="true">
    <h3>Add objective</h3>
    <label>Name<input id="add-obj-name"
        type="text"></label>
    <label>Description<textarea
        id="add-obj-description"></textarea></label>
    <div class="dialog-actions">
        <button
            data-action="cancel-add-objective">
            Cancel
        </button>
        <button
            data-action="confirm-add-objective"
            class="btn-primary">Add</button>
    </div>
</div>

<!-- Edit Objective dialog -->
<div id="edit-objective-backdrop"
    class="dialog-backdrop hidden"></div>
<div id="edit-objective-dialog"
    class="dialog hidden" aria-hidden="true">
    <h3>Edit objective</h3>
    <input id="edit-obj-id" type="hidden">
    <label>Name<input id="edit-obj-name"
        type="text"></label>
    <label>Description<textarea
        id="edit-obj-description"></textarea></label>
    <div class="dialog-actions">
        <button
            data-action="cancel-edit-objective">
            Cancel
        </button>
        <button
            data-action="confirm-edit-objective"
            class="btn-primary">Save</button>
    </div>
</div>

<!-- Confirm-archive dialog -->
<div id="confirm-archive-backdrop"
    class="dialog-backdrop hidden"></div>
<div id="confirm-archive-dialog"
    class="dialog hidden" aria-hidden="true">
    <h3>Archive objective?</h3>
    <input id="confirm-archive-id" type="hidden">
    <p>The objective stops appearing in active
        rosters but its historical scores remain
        visible.</p>
    <div class="dialog-actions">
        <button
            data-action="cancel-confirm-archive">
            Cancel
        </button>
        <button data-action="confirm-archive"
            class="btn-primary">Archive</button>
    </div>
</div>
